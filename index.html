<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マーケット情報ブリーフィング — アーカイブ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #1B1F27;
    --bg-panel: #20242D;
    --bg-panel-hover: #262B35;
    --text: #EDEAE2;
    --text-dim: #9AA0AC;
    --text-faint: #5B616E;
    --accent: #C98A3D;
    --accent-dim: #8C6432;
    --rule: #343A45;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', -apple-system, sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    max-width:820px;
    margin:0 auto;
    padding:56px 24px 96px;
  }

  .masthead{
    position:relative;
    border-bottom:2px solid var(--rule);
    padding-bottom:28px;
    margin-bottom:40px;
  }

  .stamp{
    position:absolute;
    top:-6px;
    right:0;
    border:1px solid var(--accent-dim);
    color:var(--accent);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.12em;
    padding:5px 10px;
    transform:rotate(3deg);
    opacity:0.85;
  }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.08em;
    color:var(--text-dim);
    text-transform:uppercase;
    margin-bottom:18px;
  }

  h1{
    font-family:'Source Serif 4', serif;
    font-weight:700;
    font-size:clamp(30px, 5vw, 42px);
    line-height:1.15;
    margin:0 0 10px;
    letter-spacing:-0.01em;
  }

  .subtitle{
    font-size:15px;
    color:var(--text-dim);
    max-width:520px;
  }

  .list-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.1em;
    color:var(--text-faint);
    text-transform:uppercase;
    padding:0 20px 10px;
  }

  .issue-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .issue{
    display:flex;
    align-items:center;
    gap:18px;
    background:var(--bg-panel);
    border:1px solid var(--rule);
    border-left:3px solid var(--accent-dim);
    padding:16px 20px;
    text-decoration:none;
    color:inherit;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }

  .issue:hover{
    border-left-color:var(--accent);
    background:var(--bg-panel-hover);
    transform:translateX(2px);
  }

  .issue-no{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--accent);
    width:56px;
    flex-shrink:0;
  }

  .issue-main{ flex:1; min-width:0; }

  .issue-title{
    font-weight:600;
    font-size:15.5px;
    margin-bottom:4px;
  }

  .issue-range{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--text-dim);
  }

  .issue-arrow{
    font-family:'IBM Plex Mono', monospace;
    color:var(--text-faint);
    font-size:16px;
  }

  footer{
    border-top:1px solid var(--rule);
    margin-top:48px;
    padding-top:20px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--text-faint);
  }

  @media (max-width:560px){
    .wrap{ padding:36px 18px 72px; }
    .stamp{ position:static; display:inline-block; margin-bottom:16px; transform:none; }
    .issue{ flex-wrap:wrap; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div class="stamp">社内限定・サンプル</div>
    <div class="eyebrow">Strat &amp; Tech / マーケット情報</div>
    <h1>週次マーケット情報ブリーフィング</h1>
    <p class="subtitle">事業戦略チーム向けの週次まとめアーカイブです。各号のリンクから詳細ページに移動できます。</p>
  </div>

  <div class="list-head">
    <span>号数</span>
    <span>対象期間</span>
  </div>

  <div class="issue-list">
    <a class="issue" href="pages/2026-07-13.html">
      <span class="issue-no">No.02</span>
      <span class="issue-main">
        <div class="issue-title">サンプル:EV需要とバッテリー技術の週次動向</div>
        <div class="issue-range">2026.07.07 – 2026.07.13</div>
      </span>
      <span class="issue-arrow">→</span>
    </a>
    <a class="issue" href="pages/2026-07-06.html">
      <span class="issue-no">No.01</span>
      <span class="issue-main">
        <div class="issue-title">サンプル:創刊号(テンプレート初回サンプル)</div>
        <div class="issue-range">2026.06.30 – 2026.07.06</div>
      </span>
      <span class="issue-arrow">→</span>
    </a>
  </div>

  <footer>
    新しい号は自動で上に追加されていきます / 本ページはテンプレートのサンプルです
  </footer>

</div>
</body>
</html>
